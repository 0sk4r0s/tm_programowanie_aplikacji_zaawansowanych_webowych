<!DOCTYPE html>
<html>
    <head>
        <title>Todo App</title>
        <link rel="stylesheet" href="public/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-dark">
        <div id="app" class="w-25 mx-auto bg-light vh-100 p-3">
            <h1>Co masz dzisiaj zrobić?</h1>
            <label for="todoInput">Dodaj zadanie</label>
            <input type="text" id="todoInputField"/>
            <button class="button bg-success rounded text-white" type="button" id="todoAddButton">Dodaj zadanie</button>

            <div id="todoContainer" class="mt-3"></div>

        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="public/main.js" defer></script>
    </body>
</html>
